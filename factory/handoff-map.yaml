  - { from: "300-design", to: "600-qa", file: docs/300-design/02-SPEC.md }
  - { from: "400-architecture", to: "500-engineering", file: docs/400-architecture/00-options.md }
  - { from: "400-architecture", to: "500-engineering", file: docs/400-architecture/02-containers.mmd }
  - { from: "400-architecture", to: "500-engineering", file: docs/400-architecture/06-nfrs.md }
